# ds.toml - development scripts for cosmo-python
# Run with: ds <task> (https://github.com/metaist/ds)

[scripts]

# Build
build.help = "build a single Python version"
build.shell = "./scripts/build.sh $@"

build-all.help = "build all Python versions"
build-all.shell = "./scripts/build.sh --all"

clean.help = "remove build artifacts"
clean.shell = """
  rm -rf work/;
  rm -rf dist/;
  rm -rf ci/__pycache__;
  rm -f build*.log;
"""

# Lint
lint.help = "lint shell, python, yaml, spelling, and schemas"
lint.composite = ["shellcheck", "ruff-*", "yamllint", "cspell", "cog-check", "cdx-schema"]

shellcheck.help = "lint shell scripts"
# Excluded: SC1091 (dynamic source), SC2164 (cd || exit), SC2086 (unquoted), SC2103/SC2129 (style)
# Use system shellcheck if available (apt-get install shellcheck), fall back to npx
shellcheck.shell = """
if command -v shellcheck >/dev/null 2>&1; then
  find scripts -name '*.sh' -exec shellcheck -x -e SC1091 -e SC2164 -e SC2086 -e SC2103 -e SC2129 {} +
else
  find scripts -name '*.sh' -exec npx --yes shellcheck -x -e SC1091 -e SC2164 -e SC2086 -e SC2103 -e SC2129 {} +
fi
"""

ruff-format = "uvx ruff format ${@:-ci}"
ruff-lint = "uvx ruff check --fix ${@:-ci}"

cspell.help = "check spelling"
cspell.shell = "npx --yes cspell lint --unique --gitignore '**/*.{py,md}'"

yamllint.help = "lint yaml files"
yamllint.shell = "uvx yamllint -d '{extends: relaxed, rules: {line-length: disable}}' .github/workflows/"

cdx-schema.help = "validate versions.cdx.json against CycloneDX schema"
cdx-schema.shell = "uvx check-jsonschema --schemafile https://cyclonedx.org/schema/bom-1.5.schema.json versions.cdx.json"

# Type Check
types.help = "run type checkers on Python code"
types.composite = ["ty", "pyright", "mypy"]
ty = "uvx ty check ci"
pyright = "npx --yes pyright ci"
mypy = "uvx mypy --strict ci"

# Test
test-scripts.help = "validate build script structure and syntax"
test-scripts.shell = "./scripts/test-scripts.sh"

test.help = "run unit tests with coverage"
test.shell = """
  uvx --with pytest-cov pytest \
    --doctest-modules \
    --cov=ci \
    --cov-report=term-missing \
    tests/ ci/
"""

smoke.help = "run smoke tests on a binary"
smoke.shell = "./scripts/02-python/smoke.sh $@"

smoke-all.help = "run smoke tests on all binaries in dist/"
smoke-all.shell = """
  failed=0;
  for bin in dist/python-*-cosmo.com; do
    if [ -f "$bin" ]; then
      echo "Testing: $bin";
      ./scripts/02-python/smoke.sh "$bin" || failed=1;
      echo;
    fi;
  done;
  exit $failed
"""

# Release
manifest.help = "generate manifest.json for a release"
manifest.shell = "uv run -m ci.manifest $@"

# Development
dev.help = "sanity check: lint, types, tests"
dev.composite = ["lint", "types", "test", "test-scripts"]

cog.help = "regenerate dynamic content in README.md"
cog.shell = "uvx --from cogapp cog -r README.md"

cog-check.help = "check if README.md needs regeneration"
cog-check.shell = "uvx --from cogapp cog --check README.md"

# Release
recent.help = "show commits since last tag"
recent.shell = "git log --oneline --color $(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~10)..HEAD"
