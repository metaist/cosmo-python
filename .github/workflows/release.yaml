# Release Workflow
#
# Creates a GitHub release from pre-built artifacts.
# Artifacts must be built first using the build workflow.
#
# Options:
#   - from_run_id: Download artifacts from a specific build workflow run
#   - rebuild: Build fresh instead of downloading (slower, but self-contained)
#
name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (default: YYYYMMDD-HHMMSS)"
        required: false
        type: string
      from_run_id:
        description: "Build workflow run ID to download artifacts from (leave empty to rebuild)"
        required: false
        type: string
      dry_run:
        description: "Dry run (build but do not publish)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read  # Required to download artifacts from other runs

jobs:
  # Build all versions (if not downloading from existing run)
  build:
    name: Build All Versions
    if: ${{ inputs.from_run_id == '' }}
    uses: ./.github/workflows/build.yaml
    with:
      python_version: "all"

  # Collect artifacts, attest, and create release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    # Run even if build was skipped (when using from_run_id)
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}

    steps:
      - uses: actions/checkout@v6

      - name: Generate release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG=$(date -u +"%Y%m%d-%H%M%S")
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Download artifacts from build workflow
        if: ${{ inputs.from_run_id != '' }}
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.from_run_id }}
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts from this workflow
        if: ${{ inputs.from_run_id == '' }}
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p dist
          # Find all .com files in artifact directories
          find artifacts -name "*.com" -exec cp {} dist/ \;
          find artifacts -name "*.sha256" -exec cp {} dist/ \;
          ls -la dist/

      - name: Fetch previous manifest
        id: prev_manifest
        run: |
          MANIFEST_URL="https://github.com/${{ github.repository }}/releases/latest/download/manifest.json"
          if curl -fsSL "$MANIFEST_URL" -o /tmp/prev-manifest.json 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Previous manifest found"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No previous manifest (first release?)"
          fi

      - name: Generate manifest
        run: |
          RELEASE_TAG="${{ steps.tag.outputs.release_tag }}"
          if [ "${{ steps.prev_manifest.outputs.found }}" = "true" ]; then
            ./scripts/03-ci/manifest.sh "$RELEASE_TAG" --merge /tmp/prev-manifest.json
          else
            ./scripts/03-ci/manifest.sh "$RELEASE_TAG"
          fi

      - name: Generate checksums
        run: |
          cd dist
          sha256sum python-*.com > checksums.txt
          cat checksums.txt

      - name: Generate version table
        id: versions
        run: |
          {
            echo 'table<<EOF'
            echo "| Python Version | Download |"
            echo "|----------------|----------|"
            for bin in dist/python-*-cosmo.com; do
              filename=$(basename "$bin")
              version=$(echo "$filename" | sed 's/python-\(.*\)-cosmo.com/\1/')
              minor=$(echo "$version" | cut -d. -f1,2)
              echo "| ${minor}.x | \`${filename}\` |"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/python-*.com
            dist/manifest.json
            dist/checksums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ steps.tag.outputs.release_tag }}
          path: |
            dist/python-*.com
            dist/manifest.json
            dist/checksums.txt

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          draft: false
          prerelease: false
          files: |
            dist/python-*.com
            dist/manifest.json
            dist/checksums.txt
          body: |
            ## Cosmopolitan Python Release ${{ steps.tag.outputs.release_tag }}

            ### Downloads

            ${{ steps.versions.outputs.version_table }}

            ### Usage

            ```bash
            # Download
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.release_tag }}/python-3.12.8-cosmo.com

            # Make executable and run
            chmod +x python-3.12.8-cosmo.com
            ./python-3.12.8-cosmo.com --version
            ```

            ### Programmatic Access

            Fetch `manifest.json` to discover all available versions:

            ```bash
            curl -sL https://github.com/${{ github.repository }}/releases/latest/download/manifest.json | jq .
            ```

            ### Verification

            ```bash
            # Verify checksum
            sha256sum -c checksums.txt

            # Verify build attestation (requires gh CLI)
            gh attestation verify python-3.12.8-cosmo.com --repo ${{ github.repository }}
            ```
