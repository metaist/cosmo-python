# Release Workflow
#
# Creates a GitHub release from pre-built artifacts.
# Artifacts must be built first using the build workflow.
#
# Options:
#   - release_tag: Custom tag name (default: YYYYMMDD-HHMMSS)
#   - from_run_id: Download artifacts from a specific build workflow run
#   - dry_run: Build and prepare but do not publish the release
#
name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (default: YYYYMMDD-HHMMSS)"
        required: false
        type: string
      from_run_id:
        description: "Build workflow run ID to download artifacts from (leave empty to rebuild)"
        required: false
        type: string
      dry_run:
        description: "Dry run (build but do not publish)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read # Required to download artifacts from other runs

jobs:
  # Build all versions (if not downloading from existing run)
  build:
    name: Build All Versions
    if: ${{ inputs.from_run_id == '' }}
    uses: ./.github/workflows/build.yaml
    with:
      python_version: "all"

  # Collect artifacts, attest, and create release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    # Run even if build was skipped (when using from_run_id)
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}

    steps:
      - uses: actions/checkout@v6

      - name: Generate release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG=$(date -u +"%Y%m%d-%H%M%S")
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Download artifacts from build workflow
        if: ${{ inputs.from_run_id != '' }}
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.from_run_id }}
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts from this workflow
        if: ${{ inputs.from_run_id == '' }}
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p dist
          # Find all .com files in artifact directories
          find artifacts -name "*.com" -exec cp {} dist/ \;
          find artifacts -name "*.sha256" -exec cp {} dist/ \;
          ls -la dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Fetch previous manifest
        id: prev_manifest
        run: |
          MANIFEST_URL="https://github.com/${{ github.repository }}/releases/latest/download/manifest.cdx.json"
          if curl -fsSL "$MANIFEST_URL" -o /tmp/prev-manifest.cdx.json 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Previous manifest found"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No previous manifest (first release?)"
          fi

      - name: Generate manifest
        run: |
          RELEASE_TAG="${{ steps.tag.outputs.release_tag }}"
          if [ "${{ steps.prev_manifest.outputs.found }}" = "true" ]; then
            uv run -m ci.manifest "$RELEASE_TAG" --merge /tmp/prev-manifest.cdx.json
          else
            uv run -m ci.manifest "$RELEASE_TAG"
          fi

      - name: Generate checksums
        run: |
          cd dist
          sha256sum manifest.cdx.json python-*.com > checksums.txt
          cat checksums.txt

      - name: Generate release notes
        id: versions
        run: |
          uv run -m ci.release_notes dist \
            --release-tag "${{ steps.tag.outputs.release_tag }}" \
            --update-changelog

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/checksums.txt
            dist/manifest.cdx.json
            dist/python-*.com

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ steps.tag.outputs.release_tag }}
          path: |
            dist/checksums.txt
            dist/manifest.cdx.json
            dist/python-*.com

      - name: Commit changelog updates
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog changes"
          else
            git add CHANGELOG.md
            git commit -m "update: CHANGELOG.md for release ${{ steps.tag.outputs.release_tag }}"
            git push
          fi

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: |
            ## Cosmopolitan Python Release ${{ steps.tag.outputs.release_tag }}

            ### Downloads

            ${{ steps.versions.outputs.version_table }}

            ### What's Changed

            ${{ steps.versions.outputs.changelog }}

            ### Dependencies

            ${{ steps.versions.outputs.deps_table }}

            ### Usage

            ```bash
            # Download
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.release_tag }}/python-${{ steps.versions.outputs.default_version }}-cosmo.com

            # Make executable and run
            chmod +x python-${{ steps.versions.outputs.default_version }}-cosmo.com
            ./python-${{ steps.versions.outputs.default_version }}-cosmo.com --version
            ```

            ### Verification

            ```bash
            # Verify checksum
            sha256sum -c checksums.txt

            # Verify build attestation (requires gh CLI)
            gh attestation verify python-${{ steps.versions.outputs.default_version }}-cosmo.com --repo ${{ github.repository }}
            ```
        run: |
          gh release create "${{ steps.tag.outputs.release_tag }}" \
            --title "${{ steps.tag.outputs.release_tag }}" \
            --notes "$RELEASE_NOTES" \
            dist/checksums.txt \
            dist/manifest.cdx.json \
            dist/python-*.com
