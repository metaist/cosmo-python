# Cosmopolitan Python Build Workflow
name: build

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version to build (e.g., 3.12.8), or 'all' for all versions"
        required: true
        default: "3.12.8"
        type: string

env:
  COSMOCC_VERSION: "4.0.2"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WORK_DIR: ${{ github.workspace }}/work
      DIST_DIR: ${{ github.workspace }}/dist
      COSMO_DIR: /tmp/cosmo
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Register APE with binfmt_misc
        run: |
          # This allows running Cosmopolitan binaries directly
          sudo mkdir -p /usr/bin
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register" || true

      - name: Build Python
        run: |
          if [ "${{ inputs.python_version }}" = "all" ]; then
            ./scripts/build.sh --all
          else
            ./scripts/build.sh "${{ inputs.python_version }}"
          fi

      - name: Copy APE loader for binfmt
        run: |
          # Copy APE loader after cosmocc is downloaded
          if [ -f /tmp/cosmo/bin/ape-x86_64.elf ]; then
            sudo cp /tmp/cosmo/bin/ape-x86_64.elf /usr/bin/ape
          fi

      - name: Test binary
        run: |
          for bin in dist/python-*-cosmo.com; do
            if [ -f "$bin" ]; then
              echo "Testing: $bin"
              "$bin" --version || echo "Test skipped (may need APE loader)"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cosmo-python-${{ inputs.python_version }}
          path: dist/
          if-no-files-found: warn
