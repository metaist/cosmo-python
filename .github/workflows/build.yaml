# Cosmopolitan Python Build Workflow
#
# Builds Python versions using a matrix for parallel execution.
# Each version is attested for supply chain security.
#
# Usage:
#   - Single version: python_version = "3.12.8"
#   - All versions: python_version = "all" (reads from versions.json)
#
name: build

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version(s) to build: '3.12.8', '3.12.8, 3.13.1', or 'all'"
        required: true
        default: "3.12.8"
        type: string

permissions:
  contents: read
  id-token: write       # Required for OIDC attestation
  attestations: write   # Required to upload attestations

env:
  COSMOCC_VERSION: "4.0.2"

jobs:
  # First job: determine which versions to build
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Determine versions to build
        id: versions
        run: |
          INPUT="${{ inputs.python_version }}"
          if [ "$INPUT" = "all" ]; then
            # Get all versions from versions.json
            VERSIONS=$(jq -c '[.python.versions | keys[]]' versions.json)
          else
            # Split by comma or space into JSON array
            VERSIONS=$(echo "$INPUT" | tr ',' ' ' | xargs -n1 | jq -R . | jq -sc .)
          fi
          echo "matrix={\"version\":${VERSIONS}}" >> "$GITHUB_OUTPUT"
          echo "Building versions: $VERSIONS"

  # Second job: build each version in parallel
  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Don't cancel other versions if one fails
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      WORK_DIR: ${{ github.workspace }}/work
      DIST_DIR: ${{ github.workspace }}/dist
      COSMO_DIR: /tmp/cosmo

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Register APE with binfmt_misc
        run: |
          sudo mkdir -p /usr/bin
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register" || true

      - name: Build Python ${{ matrix.version }}
        run: ./scripts/build.sh "${{ matrix.version }}"

      - name: Copy APE loader
        run: |
          if [ -f /tmp/cosmo/bin/ape-x86_64.elf ]; then
            sudo cp /tmp/cosmo/bin/ape-x86_64.elf /usr/bin/ape
          fi

      - name: Run smoke tests
        run: |
          ./scripts/04-test/smoke.sh "dist/python-${{ matrix.version }}-cosmo.com"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/python-${{ matrix.version }}-cosmo.com

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: python-${{ matrix.version }}-cosmo
          path: |
            dist/python-${{ matrix.version }}-cosmo.com
            dist/python-${{ matrix.version }}-cosmo.com.sha256
          if-no-files-found: error
