# Cosmopolitan Python Build Workflow
#
# Builds Python versions using a matrix for parallel execution.
# Attestations are added by release.yaml, not here.
#
# Structure:
#   1. setup: determine versions and cosmocc version from upstream.cdx.json
#   2. deps: build dependencies once (cached across runs)
#   3. build: build Python versions in parallel (matrix, cached per version)
#
# Caching:
#   - deps: cosmocc + libraries, keyed by upstream.cdx.json + dep scripts
#   - python: per-version binaries, keyed by upstream.cdx.json + python scripts
#   - PR builds populate cache, release builds get cache hits
#
# Usage:
#   - Single version: python_version = "3.12.8"
#   - Multiple: python_version = "3.12.8, 3.13.1"
#   - All versions: python_version = "all" (reads from upstream.cdx.json)
#
name: build

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version(s) to build: '3.12.8', '3.12.8, 3.13.1', or 'all'"
        required: true
        default: "3.12.8"
        type: string
  workflow_call:
    inputs:
      python_version:
        description: "Python version(s) to build: '3.12.8', '3.12.8, 3.13.1', or 'all'"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # First job: determine which versions to build
  setup:
    name: Setup Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      cosmocc_version: ${{ steps.versions.outputs.cosmocc_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7
        with:
          enable-cache: false

      - name: Determine versions to build
        id: versions
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
        run: uv run -m ci.build_matrix "$PYTHON_VERSION"

  # Second job: build dependencies (cached)
  deps:
    name: Build Dependencies
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      COSMO_DIR: /tmp/cosmo
      WORK_DIR: ${{ github.workspace }}/work

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7
        with:
          enable-cache: false

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            /tmp/cosmo
            work/deps
          key: deps-cosmocc${{ needs.setup.outputs.cosmocc_version }}-${{ hashFiles('upstream.cdx.json', 'scripts/*.sh') }}

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: ./scripts/build-deps.sh

  # Third job: build Python versions in parallel
  build:
    name: Build Python ${{ matrix.version }}
    needs: [setup, deps]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true  # Stop all if one fails (can't release partial set)
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      COSMO_DIR: /tmp/cosmo
      WORK_DIR: ${{ github.workspace }}/work
      DIST_DIR: ${{ github.workspace }}/dist

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Restore deps from cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            /tmp/cosmo
            work/deps
          key: deps-cosmocc${{ needs.setup.outputs.cosmocc_version }}-${{ hashFiles('upstream.cdx.json', 'scripts/*.sh') }}
          fail-on-cache-miss: true

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7
        with:
          enable-cache: false

      - name: Cache Python binary
        id: cache-python
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            dist/python-${{ matrix.version }}-cosmo.com
            dist/python-${{ matrix.version }}-cosmo.com.sha256
          key: python-${{ matrix.version }}-${{ hashFiles('upstream.cdx.json', 'scripts/python/**', 'scripts/common.sh') }}

      - name: Setup APE loader
        run: ./scripts/cosmocc.sh

      - name: Build Python ${{ matrix.version }}
        if: steps.cache-python.outputs.cache-hit != 'true'
        env:
          MATRIX_VERSION: ${{ matrix.version }}
        run: ./scripts/python/build.sh "$MATRIX_VERSION"

      - name: Run smoke tests
        env:
          MATRIX_VERSION: ${{ matrix.version }}
        run: ./scripts/smoke.sh "dist/python-$MATRIX_VERSION-cosmo.com"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-${{ matrix.version }}-cosmo
          path: |
            dist/python-${{ matrix.version }}-cosmo.com
            dist/python-${{ matrix.version }}-cosmo.com.sha256
          if-no-files-found: error
