name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install ds
        run: pipx install ds-run

      - name: Run validation (lint + test-scripts)
        run: ds dev
