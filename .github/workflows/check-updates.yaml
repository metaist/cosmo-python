# Check for Dependency Updates
#
# Runs weekly to check for newer versions of all dependencies.
# If updates are found, creates/updates a PR with the changes.
# The PR triggers CI to validate the build works with new versions.
#
name: Check Updates

on:
  schedule:
    # Run every Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    name: Check for Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Check for updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run -m ci.check_updates 2>&1 | tee /tmp/update-output.txt

          if git diff --quiet upstream.cdx.json; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "No updates found"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "Updates found!"
          fi

      - name: Create or update PR
        if: steps.check.outputs.has_updates == 'true'
        env:
          # Use PAT to allow PR to trigger other workflows (GITHUB_TOKEN can't)
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH="update/dependencies"

          # Configure git for PAT-based push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # Create or switch to branch
          git checkout -B "$BRANCH"
          git add upstream.cdx.json README.md
          git commit -m "update: dependency versions"
          git push -f origin "$BRANCH"

          # Create PR if it doesn't exist or is closed, otherwise it auto-updates
          PR_STATE=$(gh pr view "$BRANCH" --json state -q '.state' 2>/dev/null || echo "NONE")
          if [ "$PR_STATE" != "OPEN" ]; then
            gh pr create \
              --head "$BRANCH" \
              --title "update: dependency versions" \
              --label "aigen" \
              --label "dependencies" \
              --body "Automated dependency update check found newer versions available.

          ## Next Steps

          1. Review the changes to \`upstream.cdx.json\` and \`README.md\`
          2. CI will build all Python versions to verify compatibility
          3. If CI passes, merge to accept updates
          4. If CI fails, investigate which dependency caused the failure

          ---
          *This PR was automatically created by the check-updates workflow.*"
          else
            echo "PR already exists (open), updated with new commits"
          fi
