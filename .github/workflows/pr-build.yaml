# PR Build Workflow
#
# Validates dependency updates by building all Python versions.
# Triggered on PRs that modify versions.json or README.md.
#
name: PR Build

on:
  pull_request:
    paths:
      - 'versions.json'
      - 'README.md'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Continue building other versions if one fails
      matrix:
        python_version: ["3.10.16", "3.11.11", "3.12.8", "3.13.1"]

    env:
      WORK_DIR: ${{ github.workspace }}/work
      DIST_DIR: ${{ github.workspace }}/dist
      COSMO_DIR: /tmp/cosmo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Detect Python version from versions.json
        id: detect
        run: |
          # Get the latest version for this minor series from versions.json
          MINOR=$(echo "${{ matrix.python_version }}" | cut -d. -f1,2)
          VERSION=$(jq -r ".python.latest[\"$MINOR\"]" versions.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Python $VERSION (minor: $MINOR)"

      - name: Register APE with binfmt_misc
        run: |
          sudo mkdir -p /usr/bin
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register" || true

      - name: Build Python ${{ steps.detect.outputs.version }}
        run: |
          ./scripts/build.sh "${{ steps.detect.outputs.version }}"

      - name: Copy APE loader
        run: |
          if [ -f /tmp/cosmo/bin/ape-x86_64.elf ]; then
            sudo cp /tmp/cosmo/bin/ape-x86_64.elf /usr/bin/ape
          fi

      - name: Run smoke tests
        run: |
          BIN="dist/python-${{ steps.detect.outputs.version }}-cosmo.com"
          if [ -f "$BIN" ]; then
            ./scripts/04-test/smoke.sh "$BIN"
          else
            echo "Binary not found: $BIN"
            ls -la dist/
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ steps.detect.outputs.version }}-cosmo
          path: dist/python-*-cosmo.com
          if-no-files-found: error

  summary:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Check build results
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ All Python versions built successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some builds failed. Check individual job logs." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
