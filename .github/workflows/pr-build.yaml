# PR Build Workflow
#
# Validates changes by building all Python versions.
# Triggered on PRs that modify versions.json, scripts, or README.
#
name: PR Build

on:
  pull_request:
    paths:
      - 'versions.json'
      - 'README.md'
      - 'scripts/**'

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      python_version: "all"
